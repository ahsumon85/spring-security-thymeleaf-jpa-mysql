spring.mvc.view.prefix="templates"
spring.mvc.view.suffix=".html"
server.port=8088
spring.application.name=spring-boot-postgresql-app

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/basic_security
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# = Spring Security / Queries for AuthenticationManagerBuilder
# "user" must be quoted — it is a reserved word in PostgreSQL
spring.queries.users-query=select email, password, active from "user" where email=?
spring.queries.roles-query=select u.email, r.role from "user" u, role r where u.user_id = r.user_id and u.email=?
